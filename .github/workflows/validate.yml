name: Optical workstation validation
on:
  pull_request:
  push:
    branches: [main, feature/p0-foundation, feature/p1-gaussian-optics, feature/p2-1-surface-workbench, feature/p2-2-report-figure, feature/p2-3-common-project, feature/p2-4-unified-workstation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          GOLDEN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-benchmark-001
          path: |
            benchmark-results/golden-001*.json
            benchmark-results/d27-*.json
            benchmark-results/d28a-*.json
          if-no-files-found: warn
      - run: npm run artifact
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: photonic-connector-studio-checkpoint
          path: |
            artifacts/photonic-connector-studio-u1.html
            artifacts/build-info-u1.json
            artifacts/SHA256SUMS-u1.txt
            test-results/*.png

  coherent-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/coherent/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tests/coherent/requirements.txt
      - run: npm run benchmark:coherent
        env:
          GOLDEN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d28b-coherent-reference
          path: benchmark-results/d28b-*.json
          if-no-files-found: error
