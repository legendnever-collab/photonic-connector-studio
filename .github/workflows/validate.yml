name: P2.3 validation
on:
  pull_request:
  push:
    branches: [main, feature/p0-foundation, feature/p1-gaussian-optics, feature/p2-1-surface-workbench, feature/p2-2-report-figure, feature/p2-3-common-project]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run artifact
      - uses: actions/upload-artifact@v4
        with:
          name: photonic-connector-studio-p2.3
          path: |
            artifacts/photonic-connector-studio-p2.3.html
            artifacts/build-info-p2.3.json
            artifacts/SHA256SUMS-p2.3.txt
            test-results/P2.1-*.png
