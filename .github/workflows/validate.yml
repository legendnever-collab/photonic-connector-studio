name: P0 validation
on:
  pull_request:
  push:
    branches: [main, feature/p0-foundation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run artifact
      - uses: actions/upload-artifact@v4
        with:
          name: photonic-connector-studio-p0
          path: |
            artifacts/photonic-connector-studio-p0.html
            artifacts/build-info.json
            artifacts/SHA256SUMS.txt
            test-results/P0-*.png
